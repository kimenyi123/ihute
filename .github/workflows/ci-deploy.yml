name: CI and Deploy

on:
  push:
    branches:
      - GUHUZA
  pull_request:
    branches:
      - GUHUZA
  workflow_dispatch:

jobs:
  ci:
    name: Install, Audit, Lint and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Fix vulnerable dependencies
        run: npm_config_legacy_peer_deps=true npm audit fix || true

      - name: Lint (skipped - next lint not available)
        run: echo "Skipping lint: Next.js CLI has no 'lint' command in this version."

      - name: Build app
        run: npm run build

  deploy:
    name: Deploy to ai.ihute.rw (PM2)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/GUHUZA'
    steps:
      - name: Deploy over SSH and restart PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_USER }}" ] || [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] || [ -z "${{ secrets.DEPLOY_PATH }}" ] || [ -z "${{ secrets.PM2_APP_NAME }}" ]; then
              echo "Missing required GitHub Actions secrets. Aborting deploy."
              exit 1
            fi
            APP_PORT="${{ secrets.PM2_PORT }}"
            # Default for the dedicated AI app port.
            if [ -z "$APP_PORT" ]; then APP_PORT=3003; fi
            REPO_URL="https://github.com/kimenyi123/ihute.git"
            REPO_BRANCH="GUHUZA"
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"

            # Bootstrap repo into the dedicated ai folder (so other domains keep their Bitbucket deploy).
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              mkdir -p "$(dirname "$DEPLOY_PATH")"
              git clone --branch "$REPO_BRANCH" --single-branch --no-recurse-submodules "$REPO_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            # Make sure this deploy folder tracks GitHub (it may have Bitbucket as `origin` originally).
            git remote set-url origin "$REPO_URL" >/dev/null 2>&1 || git remote add origin "$REPO_URL"
            git fetch origin "$REPO_BRANCH" --prune --no-recurse-submodules || git fetch origin "$REPO_BRANCH" --prune
            git checkout -B "$REPO_BRANCH" "origin/$REPO_BRANCH"
            npm ci --legacy-peer-deps
            npm_config_legacy_peer_deps=true npm audit fix || true
            echo "Skipping lint: Next.js CLI has no 'lint' command in this version."
            npm run build
            APP_NAME="${{ secrets.PM2_APP_NAME }}"
            # Ensure the process starts on the expected port used by Nginx.
            pm2 delete "$APP_NAME" >/dev/null 2>&1 || true
            pm2 start npm --name "$APP_NAME" -- start -- -p "$APP_PORT"
            pm2 save
