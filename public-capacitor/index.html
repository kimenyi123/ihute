<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ihute — loading</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, Segoe UI, sans-serif;
        background: #0b1220;
        color: #e8f4ff;
        min-height: 100vh;
        padding: 20px;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 12px;
      }
      .muted {
        color: #8fa3b8;
        font-size: 13px;
        line-height: 1.5;
      }
      .box {
        background: #152030;
        border: 1px solid #2a3a50;
        border-radius: 12px;
        padding: 14px;
        margin-top: 12px;
        word-break: break-word;
      }
      .err {
        border-color: #b91c1c;
        background: #2a1212;
        color: #fecaca;
      }
      code {
        font-size: 12px;
        display: block;
        white-space: pre-wrap;
      }
      button {
        margin-top: 12px;
        padding: 10px 16px;
        border-radius: 10px;
        border: 0;
        background: #1897e0;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: #3d4f66;
      }
      a {
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <h1>Ihute</h1>
      <p class="muted" id="status">Checking connection…</p>
    </div>
    <script>
      (function () {
        var TARGET = "https://shop.ihute.rw/grandma";
        var HEALTH = "https://shop.ihute.rw/api/ihute-bootstrap-health";
        var LOG_KEY = "ihute_logs_v1";

        function appendLog(line) {
          try {
            var prev = [];
            var raw = localStorage.getItem(LOG_KEY);
            if (raw) prev = JSON.parse(raw);
            if (!Array.isArray(prev)) prev = [];
            prev.push(new Date().toISOString() + "  " + line);
            while (prev.length > 200) prev.shift();
            localStorage.setItem(LOG_KEY, JSON.stringify(prev));
          } catch (e) {}
        }

        function readLogText() {
          try {
            var raw = localStorage.getItem(LOG_KEY);
            var prev = raw ? JSON.parse(raw) : [];
            if (!Array.isArray(prev)) return "";
            return prev.join("\n");
          } catch (e) {
            return "";
          }
        }

        function downloadLogs() {
          var text = readLogText();
          if (!text) text = "(empty log)";
          var blob = new Blob([text], { type: "text/plain;charset=utf-8" });
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "ihute_logs.txt";
          a.click();
          URL.revokeObjectURL(a.href);
        }

        function showError(title, detail) {
          appendLog(title + " | " + detail);
          var root = document.getElementById("root");
          root.innerHTML =
            "<h1>Cannot open Ihute</h1>" +
            '<p class="muted">The app could not reach the live site. Details below and in <strong>ihute_logs.txt</strong> (download).</p>' +
            '<div class="box err"><strong>' +
            title +
            "</strong><code>" +
            detail.replace(/</g, "&lt;") +
            "</code></div>" +
            '<div class="box"><span class="muted">Target URL (WebView will load this when OK):</span><code>' +
            TARGET.replace(/</g, "&lt;") +
            "</code></div>" +
            '<div class="box"><span class="muted">Health check URL:</span><code>' +
            HEALTH.replace(/</g, "&lt;") +
            "</code></div>" +
            '<button type="button" id="dl">Download ihute_logs.txt</button> ' +
            '<button type="button" class="secondary" id="retry">Retry</button>';

          document.getElementById("dl").onclick = downloadLogs;
          document.getElementById("retry").onclick = function () {
            location.reload();
          };
        }

        function goLive() {
          appendLog("bootstrap OK → redirect to " + TARGET);
          window.location.replace(TARGET);
        }

        document.getElementById("status").textContent = "Checking " + HEALTH + " …";
        appendLog("bootstrap start HEALTH=" + HEALTH + " TARGET=" + TARGET);

        fetch(HEALTH, { method: "GET", cache: "no-store" })
          .then(function (res) {
            if (!res.ok) {
              showError(
                "Health check HTTP " + res.status,
                "GET " + HEALTH + " returned " + res.status + " " + res.statusText,
              );
              return;
            }
            return res.json().catch(function () {
              return {};
            });
          })
          .then(function (json) {
            if (json == null) return;
            if (json && json.ok === true) {
              goLive();
              return;
            }
            showError("Unexpected health response", JSON.stringify(json).slice(0, 800));
          })
          .catch(function (e) {
            var msg = e && e.message ? e.message : String(e);
            showError("Network / CORS error on health check", msg + "\n\nIf this is a dev build, set CAPACITOR_SERVER_URL and run: npx cap sync");
          });
      })();
    </script>
  </body>
</html>
